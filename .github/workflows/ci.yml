name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 22 test, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests with coverage thresholds
        run: npm run test:coverage
      - name: Run deterministic reservation evaluation
        run: npm run evaluate:parser
      - name: Run frozen reservation challenge regression gate
        run: npm run evaluate:challenge
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify migration asset
        run: cmp src/repositories/migrations/001_harden_existing_schema.sql dist/src/repositories/migrations/001_harden_existing_schema.sql
      - name: Verify browser sandbox asset
        run: cmp docs/assets/reservation-sandbox.js dist/web/reservation-sandbox.js
      - name: Verify open-source metadata
        run: |
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f CODE_OF_CONDUCT.md
          node -e "const p=require('./package.json'); if(p.license!=='Apache-2.0'||!p.repository?.url) process.exit(1)"
      - name: Audit dependencies
        run: npm audit --audit-level=high

  postgres-integration:
    name: PostgreSQL 16 integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: travel_ai_test
          POSTGRES_USER: travel_ai
          POSTGRES_PASSWORD: integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travel_ai -d travel_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://travel_ai:integration-only@127.0.0.1:5432/travel_ai_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run PostgreSQL integration tests
        run: npm run test:postgres
