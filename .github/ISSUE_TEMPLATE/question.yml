name: Usage question
description: Ask for help with local or sandbox use.
title: "[Question]: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        For suspected vulnerabilities or other confidential security reports, follow [SECURITY.md](https://github.com/cstion-ai/cstion/blob/main/SECURITY.md).
        Do not include secrets or real customer data in a public issue.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Local setup
        - Kakao webhook or OAuth
        - PostgreSQL
        - Docker or cloud
        - Architecture
        - Other
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Explain the goal, what you tried, and where you are blocked.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This issue contains no credentials, tokens, or real customer data.
          required: true
