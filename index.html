<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>우도 블랑로쉐 근무 캘린더</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="topbar card">
        <div>
          <p class="eyebrow">UDO BLANC ROCHE</p>
          <h1>2025년 12월 근무표</h1>
          <p class="sub">사진처럼 한눈에 보는 요약 + 캘린더형 근무표</p>
        </div>
        <div class="legend">
          <span><i class="dot work"></i>근무</span>
          <span><i class="dot off"></i>휴무</span>
        </div>
      </header>

      <section class="summary-section">
        <h2>인원별 근무 요약</h2>
        <div id="summaryCards" class="summary-grid"></div>
      </section>

      <section class="calendar-section card">
        <div class="calendar-head">
          <h2>월간 캘린더 근무표</h2>
          <p>주말은 색상으로 강조되고, 각 칸에는 근무/휴무 상태가 표시됩니다.</p>
        </div>
        <div class="calendar-wrap">
          <table class="calendar" aria-label="2025년 12월 우도 블랑로쉐 근무 캘린더">
            <thead>
              <tr>
                <th>일</th>
                <th>월</th>
                <th>화</th>
                <th>수</th>
                <th>목</th>
                <th>금</th>
                <th>토</th>
              </tr>
            </thead>
            <tbody id="calendarBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      const year = 2025;
      const month = 11; // 0-indexed (12월)

      const staff = [
        { name: "김진철", color: "#4a90e2" },
        { name: "김지영", color: "#2cb67d" },
        { name: "원원", color: "#e38b2c" },
        { name: "총총", color: "#c84cb2" },
      ];

      const schedule = {
        "김진철": [1, 4, 5, 6, 7, 8, 12, 13, 16, 17, 18, 19, 20, 22, 23, 24, 26, 29, 30],
        "김지영": [2, 4, 8, 9, 10, 11, 12, 13, 15, 19, 20, 21, 22, 23, 26, 27],
        "원원": [1, 2, 4, 5, 6, 7, 8, 9, 10, 11, 15, 16, 17, 18, 21, 24, 25, 26, 27, 28, 29, 30, 31],
        "총총": [1, 2, 4, 5, 6, 7, 9, 10, 11, 12, 14, 15, 16, 17, 18, 22, 23, 24, 25, 26, 27, 28, 30, 31],
      };

      const summaryCards = document.getElementById("summaryCards");
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      staff.forEach((person) => {
        const workDays = schedule[person.name].length;
        const offDays = daysInMonth - workDays;

        const card = document.createElement("article");
        card.className = "summary-card card";
        card.innerHTML = `
          <div class="card-top" style="border-top-color: ${person.color};">
            <h3>${person.name}</h3>
          </div>
          <dl>
            <div><dt>근무</dt><dd>${workDays}</dd></div>
            <div><dt>휴무</dt><dd class="off-num">${offDays}</dd></div>
          </dl>
        `;
        summaryCards.appendChild(card);
      });

      const calendarBody = document.getElementById("calendarBody");
      const firstDay = new Date(year, month, 1).getDay();

      let currentDate = 1;
      for (let week = 0; week < 6; week++) {
        const tr = document.createElement("tr");

        for (let day = 0; day < 7; day++) {
          const td = document.createElement("td");

          if ((week === 0 && day < firstDay) || currentDate > daysInMonth) {
            td.className = "empty";
            tr.appendChild(td);
            continue;
          }

          if (day === 0) td.classList.add("sun");
          if (day === 6) td.classList.add("sat");

          const workers = staff.filter((person) =>
            schedule[person.name].includes(currentDate),
          );

          td.innerHTML = `
            <div class="date">${currentDate}</div>
            <ul class="shift-list">
              ${staff
                .map((person) => {
                  const isWorking = workers.some((w) => w.name === person.name);
                  const badge = isWorking ? "근무" : "휴무";
                  const cls = isWorking ? "on" : "off";
                  return `<li><span class="name">${person.name}</span><span class="badge ${cls}">${badge}</span></li>`;
                })
                .join("")}
            </ul>
          `;

          tr.appendChild(td);
          currentDate++;
        }

        calendarBody.appendChild(tr);

        if (currentDate > daysInMonth) break;
      }
    </script>
  </body>
</html>
